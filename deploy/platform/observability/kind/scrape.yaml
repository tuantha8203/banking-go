# Scrape targets for the platform dashboard (kind): CNPG instance metrics + RabbitMQ prometheus plugin.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: pg
  namespace: banking-data
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: pg
  podMetricsEndpoints:
    - port: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rmq
  namespace: banking-data
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: rmq
  endpoints:
    - port: prometheus
      interval: 30s
