# cert-manager v1.21.2 on kind (chart jetstack/cert-manager).
crds:
  enabled: true
replicaCount: 1
resources:
  requests: {cpu: 10m, memory: 64Mi}
  limits: {memory: 192Mi}
webhook:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 96Mi}
cainjector:
  resources:
    requests: {cpu: 10m, memory: 64Mi}
    limits: {memory: 192Mi}
prometheus:
  enabled: true
  servicemonitor:
    enabled: false   # T13 turns it on once the ServiceMonitor CRD exists
