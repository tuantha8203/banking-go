# Local development dependencies (deployment.md D-1). Official upstream images only, no Bitnami.
#   docker compose -f deploy/compose/compose.yaml up -d                 # postgres, rabbitmq, seaweedfs
#   docker compose -f deploy/compose/compose.yaml --profile obs up -d   # + OpenTelemetry Collector
# Go services run on the host (`go run`, see `make run`); credentials below are local-only.
name: banking-go

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.3-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: banking
      RABBITMQ_DEFAULT_PASS: banking
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command:
      - server
      - -dir=/data
      - -ip=seaweedfs
      - -ip.bind=0.0.0.0
      - -master.volumeSizeLimitMB=128
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333" # S3 API
      - "9333:9333" # master UI
    volumes:
      - seaweeddata:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    profiles: ["obs"]
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "4317:4317" # OTLP gRPC (OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317)
      - "4318:4318" # OTLP HTTP
      - "13133:13133" # health_check extension
    volumes:
      - ./otelcol/config.yaml:/etc/otelcol/config.yaml:ro
    # The image is distroless (no shell/wget), so no container healthcheck;
    # probe http://localhost:13133/ from the host instead.

volumes:
  pgdata:
  rabbitmqdata:
  seaweeddata:
