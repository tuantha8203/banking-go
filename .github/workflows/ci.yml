name: ci

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local
  GOLANGCI_LINT_VERSION: v2.14.0

jobs:
  go:
    name: go (lint, test, generated code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: |
            **/go.sum
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true
      - name: golangci-lint (per module)
        run: make lint-go
      - name: go vet
        run: make vet
      - name: go test
        run: go test -race ./pkg/... ./services/core/... ./services/public-api/... ./services/admin-api/... ./services/mocks/...
      - name: Generated code is committed (protobuf + OpenAPI, AD-9)
        run: make gen-check

  web:
    name: web (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r test

  proto:
    name: proto (buf lint, breaking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: tools/go.sum
      - name: buf lint
        run: make lint-proto
      - name: buf breaking against main
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || 'main' }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "push" ]; then
            # On main itself compare with the previous commit.
            git update-ref refs/remotes/origin/base HEAD~1 || { echo "no previous commit; skipping"; exit 0; }
          else
            git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/base"
          fi
          if ! git cat-file -e refs/remotes/origin/base:proto/buf.yaml 2>/dev/null; then
            echo "base has no proto/ yet; skipping buf breaking"
            exit 0
          fi
          cd tools && GOWORK=off go tool buf breaking ../proto --against '../.git#ref=refs/remotes/origin/base,subdir=proto'

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            zricethezav/gitleaks:v8.30.0 git /repo --redact --verbose --exit-code 1

  images:
    name: image ${{ matrix.image }} (build, no push)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: core, dockerfile: deploy/docker/go.Dockerfile, build-arg: SERVICE=core}
          - {image: public-api, dockerfile: deploy/docker/go.Dockerfile, build-arg: SERVICE=public-api}
          - {image: admin-api, dockerfile: deploy/docker/go.Dockerfile, build-arg: SERVICE=admin-api}
          - {image: mocks, dockerfile: deploy/docker/go.Dockerfile, build-arg: SERVICE=mocks}
          - {image: web-customer, dockerfile: deploy/docker/spa.Dockerfile, build-arg: APP=web-customer}
          - {image: web-admin, dockerfile: deploy/docker/spa.Dockerfile, build-arg: APP=web-admin}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            ${{ matrix.build-arg }}
            VERSION=sha-${{ github.sha }}
            COMMIT=${{ github.sha }}
          push: false
          tags: banking-go/${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: deploy (helm lint + kubeconform 1.36 + helm-unittest, manifests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: tools/go.sum
      - run: make tools-k8s
      - run: make helm-lint helm-test
      - name: Vendored manifests match deploy/platform/vendor.lock
        run: scripts/vendor-manifests.sh --check
      - name: No plaintext Secret under deploy/ (spec criterion 6)
        run: scripts/check-no-plain-secrets.sh
      - name: Release/rollback helper tests
        run: make scripts-test

  observability:
    name: observability (promtool, dashboards, alertmanager, runbooks, generated objects, collector)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: tools/go.sum
      - run: make tools-k8s
      - run: make alerts-test dashboards-test alertmanager-test runbooks-test obs-gen-check collector-validate

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: tools/go.sum
      - run: make actionlint
